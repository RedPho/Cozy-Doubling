# Cozy Doubling on one VM: API + PostgreSQL + Caddy (automatic HTTPS).
# Run from this folder: docker compose up -d --build
# Needs .env and firebase-service-account.json next to this file (both git-ignored); see README.md.
name: cozy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cozy
      POSTGRES_DB: cozy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cozy -d cozy"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cozy:${POSTGRES_PASSWORD}@db:5432/cozy
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase.json
      # Only Caddy can reach the API, so trust its X-Forwarded-For (real client IP for the login throttle).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase.json:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
