# Committed, non-secret defaults read by the secrets-gradle-plugin.
# Override any of these in local.properties (git-ignored).

# Legal pages served by GitHub Pages from /docs on main.
TERMS_OF_SERVICE_URL=https://redpho.github.io/Cozy-Doubling/terms-of-service.html
PRIVACY_POLICY_URL=https://redpho.github.io/Cozy-Doubling/privacy-policy.html
ACCOUNT_DELETION_URL=https://redpho.github.io/Cozy-Doubling/delete-account.html

# GOOGLE_WEB_CLIENT_ID (OAuth 2.0 *web* client ID) is read directly by app/build.gradle.kts from
# local.properties or -PgoogleWebClientId. Unset: debug builds use mock Google tokens against the
# local backend; release packaging fails.
# REVENUECAT_APIKEY (public goog_ SDK key) works the same way: unset = simulated purchases in debug,
# release packaging fails.
